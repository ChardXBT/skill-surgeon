[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-surgeon"
version = "0.3.0"
description = "Audit agent skills, propose repairs, apply them after operator approval — with an open-weight local model for semantic checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
surgeon = "surgeon.cli:main"

[tool.setuptools.packages.find]
include = ["surgeon*"]
